<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#1E4D2B" />
    <title>Feira Livre — Comércio Direto da Agricultura Familiar de Sergipe</title>
    <meta name="description" content="Alimentos frescos, agroecológicos e artesanais direto dos pequenos produtores de Sergipe para a sua casa." />
    <link rel="icon" type="image/png" href="images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Os placeholders abaixo serão preenchidos pelos scripts -->
    
    <div id="api-status-placeholder"></div>
    <div id="header-placeholder"></div>
    <div id="subnav-placeholder"></div>

    <main class="main-wrapper">
      <div id="home-placeholder"></div>
      <div id="produtos-placeholder"></div>
      <div id="produtores-placeholder"></div>
      <div id="checkout-placeholder"></div>
      <div id="rastreamento-placeholder"></div>
      <div id="feiramais-placeholder"></div>
      <div id="produtor-painel-placeholder"></div>
      <div id="logistica-placeholder"></div>
      <div id="sobre-placeholder"></div>
    </main>

    <div id="cart-drawer-placeholder"></div>
    
    <!-- Toast Notificação -->
    <div class="toast-notice" id="toast"></div>

    <div id="footer-placeholder"></div>
    
    <div id="modal-checkout-placeholder"></div>
    <div id="modal-cancelar-placeholder"></div>

    <!-- 1. Carregamento da Interface (Componentes e Views injetados via JS) -->
    <script src="components/api-status.js"></script>
    <script src="components/header.js"></script>
    <script src="components/subnav.js"></script>
    <script src="views/home.js"></script>
    <script src="views/produtos.js"></script>
    <script src="views/produtores.js"></script>
    <script src="views/checkout.js"></script>
    <script src="views/rastreamento.js"></script>
    <script src="views/feiramais.js"></script>
    <script src="views/produtor-painel.js"></script>
    <script src="views/logistica.js"></script>
    <script src="views/sobre.js"></script>
    <script src="components/cart-drawer.js"></script>
    <script src="components/footer.js"></script>
    <script src="components/modal-checkout.js"></script>
    <script src="components/modal-cancelar.js"></script>

    <!-- 2. Scripts de Lógica Principal -->
    <script src="main.js"></script>
    <script src="api.js"></script>
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="checkout.js"></script>
    <script src="logistica.js"></script>
    <script src="subscription.js"></script>
    <script src="pwa.js"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then(
            (registration) => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            },
            (err) => {
              console.log('ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
